<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/stylesFunciones.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Manejando eventos</title>
</head>

<body>
    <header>
        <div class="px-3 py-2 text-bg-dark fixed-top">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <a href="../indexFunciones.html"
                        class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
                        <img src="../img/js.png" alt="" width="32" height="32" class="me-2" />
                    </a>

                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small nav-bar">
                        <li class="text-center">
                            <a href="recursividad.html" class="nav-link text-white">
                                <i class="bi bi-arrow-clockwise bi-2 d-block"></i>
                                Recursividad
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="tabla.html" class="nav-link text-white">
                                <i class="bi bi-table bi-2 d-block"></i>
                                Creando una Tabla
                            </a>
                        </li>
                        <li class="text-center nav-bar-li-active">
                            <a href="formulario.html" class="nav-link text-white">
                                <i class="bi bi-ui-checks bi-2 d-block"></i>
                                Formulario
                            </a>
                        </li>
                        <li class="text-center"><a href="validaciones.html" class="nav-link text-white">Validaciones</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <div class="container-lg">
           <div class="row">
    <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
        <h3>Expediente médico</h3>
        <form id="idForm">
            <div class="row">
                <div class="col-lg-6 mb-3">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="idTxtNombre" placeholder="Nombre del paciente">
                        <label for="idTxtNombre">Nombre del paciente</label>
                    </div>
                </div>
                <div class="col-lg-6 mb-3">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="idTxtApellido" placeholder="Apellido del paciente">
                        <label for="idTxtApellido">Apellido del paciente</label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6 mb-3">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="idTxtFechaNacimiento" placeholder="Fecha de nacimiento">
                        <label for="idTxtFechaNacimiento">Fecha nacimiento</label>
                    </div>
                </div>
                <div class="col-lg-6 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="rdSexo" id="idRdMasculino" value="Hombre">
                        <label class="form-check-label" for="idRdMasculino">Hombre</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="rdSexo" id="idRdFemenino" value="Mujer">
                        <label class="form-check-label" for="idRdFemenino">Mujer</label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6 mb-3">
                    <select class="form-select" aria-label="País" id="idCmbPais">
                        <option value="0" selected>Seleccione un País</option>
                        <option value="1">El Salvador</option>
                        <option value="2">Honduras</option>
                        <option value="3">Panama</option>
                        <option value="4">Costa Rica</option>
                        <option value="5">Belice</option>
                        <option value="6">Nicaragua</option>
                        <option value="7">Chile</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12 mb-3">
                    <div class="form-floating">
                        <textarea class="form-control" placeholder="Dirección" id="idTxtDireccion" style="height:100px"></textarea>
                        <label for="idTxtDireccion">Dirección</label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <button id="idBtnAgregar" type="button" class="btn btn-success">Guardar Datos</button>
                    <button id="idBtnMostrar" type="button" class="btn btn-warning">Mostrar personas</button>
                    <button id="idBtnLimpiar" type="button" class="btn btn-danger">Limpiar formulario</button>
                    <button id="idBtnAgregarPais" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#idModal">Nuevo País</button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
        <h3>Pacientes registrados</h3>
        <div id="idTablaPacientes">Ninguno</div>
    </div>
</div>
<div class="modal fade" id="idModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="modalLabel">Agregando nuevo país</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="idFormPais">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="idNombrePais" placeholder="Nombre del país">
                        <label for="idNombrePais">Nombre del país</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="idBtnAddPais">Agregar país</button>
            </div>
        </div>
    </div>
</div>
<div class="toast-container top-0 start-50 translate-middle-x pt-4 mt-1" style="z-index:1035">
    <div id="idNotificacion" class="toast text-bg-success" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">Notificación</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
        <div class="toast-body" id="idMensaje"></div>
    </div>
</div>        
    </div>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/formulario.js" defer></script>
</body>

</html>
