<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compañía Miau | Guía 3</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <input type="checkbox" id="checkMenu">
    <label for="checkMenu" class="labelBotonMenu" aria-label="Abrir o cerrar menú">
        <i class="fa fa-bars" id="btnMostrar" aria-hidden="true"></i>
        <i class="fa fa-times" id="btnOcultar" aria-hidden="true"></i>
    </label>
    <aside class="sidebar">
        <header>
            <div class="logo"><img src="images/logo.png" alt="Logo de Compañía Miau"></div>
            <span class="titulo">Compañía Miau</span>
        </header>
        <nav aria-label="Menú lateral">
            <ul>
                <li><a href="#inicio"><i class="fa fa-home"></i>Inicio</a></li>
                <li><a href="#servicios"><i class="fa fa-paw"></i>Servicios</a></li>
                <li><a href="#equipo"><i class="fa fa-users"></i>Equipo</a></li>
                <li><a href="#configuracion"><i class="fa fa-cog"></i>Configuración</a></li>
                <li><a href="#acerca"><i class="fa fa-question-circle-o"></i>Acerca de</a></li>
                <li><a href="#contacto"><i class="fa fa-envelope-o"></i>Contacto</a></li>
            </ul>
        </nav>
    </aside>
    <main class="container" id="inicio">
        <div class="presentacion">
            <p>Guía 3 · Posicionamiento CSS</p>
            <h1>Compañía Miau</h1>
            <p>Ejemplo de menú lateral desplegable construido con CSS y un checkbox, sin JavaScript.</p>
        </div>
    </main>
</body>
</html>
